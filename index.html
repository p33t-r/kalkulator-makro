<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dzienny Kalkulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Dzienny Kalkulator</h1>
    <p class="subtitle">Dane są automatycznie zerowane z nadejściem nowego dnia.</p>

    <form id="dailyForm">
      <div class="form-group">
        <label for="inputA">Wartość A:</label>
        <input type="number" id="inputA" placeholder="Wpisz liczbę..." step="any">
      </div>

      <div class="form-group">
        <label for="inputB">Wartość B:</label>
        <input type="number" id="inputB" placeholder="Wpisz liczbę..." step="any">
      </div>

      <button type="button" id="calcBtn">Oblicz i Zapisz</button>
      <button type="button" id="resetBtn" class="secondary-btn">Ręczne Wyczyszczenie</button>
    </form>

    <div class="results-box">
      <h2>Wyniki z dzisiaj:</h2>
      <p>Suma: <strong id="resultSum" class="calculated-result">-</strong></p>
      <p>Iloczyn: <strong id="resultProduct" class="calculated-result">-</strong></p>
      <p class="status-info">Ostatnia zmiana: <span id="lastSavedTime">-</span></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

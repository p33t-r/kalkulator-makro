<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Makro AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; max-width: 600px; margin: 0 auto; padding-bottom: 40px; }

    h1, h2, h3 { font-weight: 600; margin-bottom: 8px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }

    /* Settings & Controls */
    .settings-btn { position: fixed; top: 12px; right: 12px; background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; z-index: 10; }
    
    /* Top Summary - Circular Gauges */
    .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin-top: 12px; }
    .gauge-box { background: #0f172a; padding: 10px 4px; border-radius: 12px; border: 1px solid var(--card-border); display: flex; flex-direction: column; align-items: center; }
    .gauge-container { position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; margin: 4px 0; }
    .gauge-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .gauge-bg { fill: none; stroke: var(--card-border); stroke-width: 3.8; }
    .gauge-fill { fill: none; stroke-width: 3.8; stroke-linecap: round; transition: stroke-dasharray 0.5s ease, stroke 0.3s ease; }
    .gauge-text { position: absolute; font-size: 11px; font-weight: bold; color: var(--text); }
    .summary-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .target-val { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    /* Profile & Manual Targets */
    .profile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    .profile-grid .full-width { grid-column: span 2; }
    .profile-details { display: none; margin-top: 10px; border-top: 1px solid var(--card-border); padding-top: 10px; }
    .toggle-profile-btn { background: transparent; border: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 4px 0; font-weight: 500; }
    .manual-target-box { background: #0f172a; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--card-border); }

    /* Meal Section */
    .meal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 4px; }
    .meal-actions { display: flex; gap: 6px; align-items: center; }
    .meal-macro { font-size: 12px; color: var(--success); font-weight: 500; margin-bottom: 8px; }
    
    .item-row { display: grid; grid-template-columns: 1fr 70px 80px 32px; gap: 6px; margin-bottom: 8px; align-items: center; }
    input, select, button { background: #0f172a; border: 1px solid var(--card-border); color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    
    .btn { background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:active { background: var(--accent-hover); }
    .btn-sm { padding: 6px 10px; font-size: 11px; }
    .btn-add { background: transparent; border: 1px dashed var(--accent); color: var(--accent); width: 100%; margin-top: 6px; }
    .btn-remove { background: transparent; border: none; color: var(--danger); font-size: 18px; cursor: pointer; padding: 0; }
    .btn-reset-meal { background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); padding: 4px 8px; font-size: 11px; }
    .btn-history-meal { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 4px 8px; font-size: 11px; }
    
    .action-bar { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 12px; }
    .btn-calc { background: var(--success); width: 100%; padding: 12px; font-size: 15px; }
    .btn-clear-day { background: transparent; border: 1px solid var(--danger); color: var(--danger); width: 100%; padding: 12px; font-size: 13px; font-weight: 600; }

    /* Modal Base */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal-content { background: var(--card-bg); border-radius: 12px; padding: 20px; width: 100%; max-width: 450px; max-height: 85vh; overflow-y: auto; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; }

    .history-item { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--card-border); cursor: pointer; }
    .history-item:hover { border-color: var(--accent); }

    .loading { display: none; text-align: center; font-size: 14px; color: var(--accent); margin-top: 10px; }
  </style>
</head>
<body>

  <button class="settings-btn" onclick="openModal('settings-modal')">⚙️</button>

  <!-- Profile & Targets Card -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Moje Cele i Profil</h2>
      <button class="toggle-profile-btn" onclick="toggleProfile()">Edytuj cele ✏️</button>
    </div>

    <!-- Hidden Profile & Targets Inputs -->
    <div class="profile-details" id="profile-details">
      <!-- Manual Calorie Target Entry -->
      <div class="manual-target-box">
        <label style="font-size: 12px; color: var(--text-muted);">Ustaw ręcznie cel kaloryczny (Kcal):</label>
        <div style="display: flex; gap: 6px; margin-top: 6px;">
          <input type="number" id="manual-kcal-input" placeholder="np. 2200">
          <button class="btn btn-sm" onclick="setManualCalorieTarget()">Ustaw i przelicz makro</button>
        </div>
      </div>

      <div style="text-align: center; margin: 10px 0; font-size: 12px; color: var(--text-muted);">— LUB oblicz zapotrzebowanie z AI —</div>

      <div class="profile-grid">
        <div class="form-group">
          <label>Płeć</label>
          <select id="prof-gender"><option value="mężczyzna">Mężczyzna</option><option value="kobieta">Kobieta</option></select>
        </div>
        <div class="form-group">
          <label>Wiek</label>
          <input type="number" id="prof-age" value="30">
        </div>
        <div class="form-group">
          <label>Wzrost (cm)</label>
          <input type="number" id="prof-height" value="180">
        </div>
        <div class="form-group">
          <label>Waga (kg)</label>
          <input type="number" id="prof-weight" value="80">
        </div>
        <div class="form-group full-width">
          <label>Intensywność treningów / Cel</label>
          <input type="text" id="prof-goal" placeholder="np. 3x trening siłowy, redukcja">
        </div>
      </div>
      <button class="btn btn-sm" style="width: 100%; margin-top: 6px;" onclick="calculateTargetsWithAI()">Oblicz pełny cel z AI 🎯</button>
    </div>
  </div>

  <!-- Summary Card with Gauges -->
  <div class="card">
    <h2>Podsumowanie Dnia</h2>
    <div class="summary-grid">
      <!-- Kcal Gauge -->
      <div class="gauge-box">
        <div class="summary-label">Kcal</div>
        <div class="gauge-container">
          <svg class="gauge-svg" viewBox="0 0 36 36">
            <path class="gauge-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="gauge-fill" id="gauge-fill-kcal" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <div class="gauge-text" id="sum-kcal">0</div>
        </div>
        <div class="target-val" id="target-kcal">/ 0</div>
      </div>

      <!-- Protein Gauge -->
      <div class="gauge-box">
        <div class="summary-label">Białko</div>
        <div class="gauge-container">
          <svg class="gauge-svg" viewBox="0 0 36 36">
            <path class="gauge-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="gauge-fill" id="gauge-fill-p" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <div class="gauge-text" id="sum-p">0g</div>
        </div>
        <div class="target-val" id="target-p">/ 0g</div>
      </div>

      <!-- Fat Gauge -->
      <div class="gauge-box">
        <div class="summary-label">Tłuszcze</div>
        <div class="gauge-container">
          <svg class="gauge-svg" viewBox="0 0 36 36">
            <path class="gauge-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="gauge-fill" id="gauge-fill-f" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <div class="gauge-text" id="sum-f">0g</div>
        </div>
        <div class="target-val" id="target-f">/ 0g</div>
      </div>

      <!-- Carbs Gauge -->
      <div class="gauge-box">
        <div class="summary-label">Węgle</div>
        <div class="gauge-container">
          <svg class="gauge-svg" viewBox="0 0 36 36">
            <path class="gauge-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="gauge-fill" id="gauge-fill-c" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <div class="gauge-text" id="sum-c">0g</div>
        </div>
        <div class="target-val" id="target-c">/ 0g</div>
      </div>
    </div>
  </div>

  <!-- Meals Container -->
  <div id="meals-container"></div>

  <!-- Bottom Action Buttons -->
  <div class="action-bar">
    <button class="btn btn-calc" onclick="calculateAllWithAI()">Przelicz z AI ✨</button>
    <button class="btn btn-clear-day" onclick="resetWholeDay()">🔄 Reset dnia</button>
  </div>
  <div class="loading" id="loading-spinner">AI analizuje Twoje posiłki... ⏳</div>

  <!-- Settings Modal -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h3>Ustawienia API</h3>
      <div class="form-group" style="margin-top: 12px;">
        <label>Twój Klucz Gemini API:</label>
        <input type="password" id="api-key-input" placeholder="Wklej klucz API...">
      </div>
      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="saveApiKey()">Zapisz Klucz</button>
      <button class="btn" style="width: 100%; margin-top: 6px; background: transparent; border: 1px solid var(--card-border);" onclick="closeModal('settings-modal')">Zamknij</button>
    </div>
  </div>

  <!-- History Modal for Copying Meals -->
  <div class="modal" id="history-modal">
    <div class="modal-content">
      <h3 id="history-modal-title">Dodaj z historii</h3>
      <div id="history-list" style="margin-top: 12px;"></div>
      <button class="btn" style="width: 100%; margin-top: 10px; background: transparent; border: 1px solid var(--card-border);" onclick="closeModal('history-modal')">Zamknij</button>
    </div>
  </div>

  <datalist id="saved-ingredients-list"></datalist>

  <script>
    const MEALS_CONFIG = [
      { id: 'breakfast', name: 'Śniadanie' },
      { id: 'lunch', name: 'Obiad' },
      { id: 'dinner', name: 'Kolacja' },
      { id: 'snacks', name: 'Przekąski / Napoje / Inne' }
    ];

    const UNITS = ['g', 'szt', 'ml', 'plaster', 'łyżka', 'szklanka', 'porcja'];

    let state = {
      apiKey: localStorage.getItem('gemini_api_key') || '',
      targets: JSON.parse(localStorage.getItem('macro_targets')) || { kcal: 2000, p: 150, f: 70, c: 200 },
      meals: JSON.parse(localStorage.getItem('daily_meals_data')) || {},
      customIngredients: JSON.parse(localStorage.getItem('custom_ingredients_list')) || [],
      mealsHistory: JSON.parse(localStorage.getItem('meals_history')) || []
    };

    let activeHistoryMealId = null;

    function init() {
      if (!state.apiKey) openModal('settings-modal');
      
      MEALS_CONFIG.forEach(mealCfg => {
        if (!state.meals[mealCfg.id] || !Array.isArray(state.meals[mealCfg.id])) {
          state.meals[mealCfg.id] = [{ name: '', amount: '', unit: 'g', kcal: 0, p: 0, f: 0, c: 0 }];
        } else {
          state.meals[mealCfg.id] = state.meals[mealCfg.id].filter(item => item.name || item.amount);
          if (state.meals[mealCfg.id].length === 0) {
            state.meals[mealCfg.id] = [{ name: '', amount: '', unit: 'g', kcal: 0, p: 0, f: 0, c: 0 }];
          }
        }
      });

      renderTargets();
      updateIngredientsDatalist();
      renderMeals();
    }

    function toggleProfile() {
      const el = document.getElementById('profile-details');
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function setManualCalorieTarget() {
      const kcalVal = parseFloat(document.getElementById('manual-kcal-input').value);
      if (!kcalVal || kcalVal <= 0) {
        alert("Wpisz poprawną wartość kalorii!");
        return;
      }

      // Proporcje: 25% Białko, 30% Tłuszcze, 45% Węglowodany
      const pGrams = Math.round((kcalVal * 0.25) / 4);
      const fGrams = Math.round((kcalVal * 0.30) / 9);
      const cGrams = Math.round((kcalVal * 0.45) / 4);

      state.targets = { kcal: kcalVal, p: pGrams, f: fGrams, c: cGrams };
      localStorage.setItem('macro_targets', JSON.stringify(state.targets));
      renderTargets();
      renderMeals();
      toggleProfile();
    }

    function renderTargets() {
      document.getElementById('target-kcal').innerText = `/ ${state.targets.kcal}`;
      document.getElementById('target-p').innerText = `/ ${state.targets.p}g`;
      document.getElementById('target-f').innerText = `/ ${state.targets.f}g`;
      document.getElementById('target-c').innerText = `/ ${state.targets.c}g`;
      document.getElementById('manual-kcal-input').value = state.targets.kcal;
    }

    function updateIngredientsDatalist() {
      const datalist = document.getElementById('saved-ingredients-list');
      if (!datalist) return;
      datalist.innerHTML = state.customIngredients.map(item => `<option value="${item}">`).join('');
    }

    function saveNewIngredientName(name) {
      const cleanName = name.trim();
      if (cleanName && !state.customIngredients.includes(cleanName)) {
        state.customIngredients.push(cleanName);
        state.customIngredients.sort();
        localStorage.setItem('custom_ingredients_list', JSON.stringify(state.customIngredients));
        updateIngredientsDatalist();
      }
    }

    function updateGauge(type, current, target) {
      const fillEl = document.getElementById(`gauge-fill-${type}`);
      if (!fillEl || !target) return;

      const percent = Math.min(Math.round((current / target) * 100), 100);
      fillEl.setAttribute('stroke-dasharray', `${percent}, 100`);

      const ratio = current / target;
      if (ratio > 1.15) {
        fillEl.style.stroke = 'var(--danger)';
      } else if (ratio >= 0.85 && ratio <= 1.15) {
        fillEl.style.stroke = 'var(--success)';
      } else {
        fillEl.style.stroke = 'var(--accent)';
      }
    }

    function renderMeals() {
      const container = document.getElementById('meals-container');
      container.innerHTML = '';

      let dayTotal = { kcal: 0, p: 0, f: 0, c: 0 };

      MEALS_CONFIG.forEach(mealCfg => {
        const mealData = state.meals[mealCfg.id];
        let mealTotal = { kcal: 0, p: 0, f: 0, c: 0 };

        mealData.forEach(item => {
          mealTotal.kcal += item.kcal || 0;
          mealTotal.p += item.p || 0;
          mealTotal.f += item.f || 0;
          mealTotal.c += item.c || 0;
        });

        dayTotal.kcal += mealTotal.kcal;
        dayTotal.p += mealTotal.p;
        dayTotal.f += mealTotal.f;
        dayTotal.c += mealTotal.c;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="meal-header">
            <h3>${mealCfg.name}</h3>
            <div class="meal-actions">
              <button class="btn btn-history-meal" onclick="openMealHistoryModal('${mealCfg.id}')">📋 Historia</button>
              <button class="btn btn-reset-meal" onclick="resetSingleMeal('${mealCfg.id}')">🗑️ Reset</button>
            </div>
          </div>
          <div class="meal-macro">${Math.round(mealTotal.kcal)} kcal | B:${Math.round(mealTotal.p)}g T:${Math.round(mealTotal.f)}g W:${Math.round(mealTotal.c)}g</div>
          <div id="items-${mealCfg.id}">
            ${mealData.map((item, idx) => `
              <div class="item-row">
                <input type="text" list="saved-ingredients-list" placeholder="Składnik" value="${item.name}" onchange="updateItem('${mealCfg.id}', ${idx}, 'name', this.value)">
                <input type="number" placeholder="Ilość" value="${item.amount}" onchange="updateItem('${mealCfg.id}', ${idx}, 'amount', this.value)">
                <select onchange="updateItem('${mealCfg.id}', ${idx}, 'unit', this.value)">
                  ${UNITS.map(u => `<option value="${u}" ${item.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
                </select>
                <button class="btn-remove" onclick="removeItem('${mealCfg.id}', ${idx})">✕</button>
              </div>
            `).join('')}
          </div>
          <button class="btn btn-add" onclick="addItem('${mealCfg.id}')">+ Dodaj pole</button>
        `;
        container.appendChild(card);
      });

      document.getElementById('sum-kcal').innerText = Math.round(dayTotal.kcal);
      document.getElementById('sum-p').innerText = Math.round(dayTotal.p) + 'g';
      document.getElementById('sum-f').innerText = Math.round(dayTotal.f) + 'g';
      document.getElementById('sum-c').innerText = Math.round(dayTotal.c) + 'g';

      updateGauge('kcal', dayTotal.kcal, state.targets.kcal);
      updateGauge('p', dayTotal.p, state.targets.p);
      updateGauge('f', dayTotal.f, state.targets.f);
      updateGauge('c', dayTotal.c, state.targets.c);

      localStorage.setItem('daily_meals_data', JSON.stringify(state.meals));
    }

    function updateItem(mealId, idx, field, value) {
      state.meals[mealId][idx][field] = field === 'amount' ? parseFloat(value) || '' : value;
      if (field === 'name' && value) {
        saveNewIngredientName(value);
      }
      localStorage.setItem('daily_meals_data', JSON.stringify(state.meals));
    }

    function addItem(mealId) {
      state.meals[mealId].push({ name: '', amount: '', unit: 'g', kcal: 0, p: 0, f: 0, c: 0 });
      renderMeals();
    }

    function removeItem(mealId, idx) {
      if (state.meals[mealId].length > 1) {
        state.meals[mealId].splice(idx, 1);
      } else {
        state.meals[mealId][0] = { name: '', amount: '', unit: 'g', kcal: 0, p: 0, f: 0, c: 0 };
      }
      renderMeals();
    }

    function resetSingleMeal(mealId) {
      state.meals[mealId] = [{ name: '', amount: '', unit: 'g', kcal: 0, p: 0, f: 0, c: 0 }];
      renderMeals();
    }

    function resetWholeDay() {
      if (confirm("Czy na pewno chcesz wyczyścić wszystkie wpisane dziś posiłki?")) {
        MEALS_CONFIG.forEach(m => {
          state.meals[m.id] = [{ name: '', amount: '', unit: 'g', kcal: 0, p: 0, f: 0, c: 0 }];
        });
        renderMeals();
      }
    }

    /* History & Copy Meal Functionality */
    function saveCurrentStateToHistory() {
      const todayStr = new Date().toLocaleDateString('pl-PL');
      
      MEALS_CONFIG.forEach(m => {
        const items = state.meals[m.id].filter(i => i.name && i.amount);
        if (items.length > 0) {
          state.mealsHistory.unshift({
            date: todayStr,
            mealId: m.id,
            mealName: m.name,
            items: JSON.parse(JSON.stringify(items))
          });
        }
      });

      // Keep last 30 entries in history
      state.mealsHistory = state.mealsHistory.slice(0, 30);
      localStorage.setItem('meals_history', JSON.stringify(state.mealsHistory));
    }

    function openMealHistoryModal(mealId) {
      activeHistoryMealId = mealId;
      const historyList = document.getElementById('history-list');
      const filtered = state.mealsHistory.filter(h => h.mealId === mealId);

      if (filtered.length === 0) {
        historyList.innerHTML = `<div style="text-align: center; font-size: 13px; color: var(--text-muted); padding: 10px;">Brak historii dla tego posiłku. Wykonaj przeliczenie z AI, aby zapisać historię.</div>`;
      } else {
        historyList.innerHTML = filtered.map((h, idx) => `
          <div class="history-item" onclick="copyMealFromHistory(${idx}, '${mealId}')">
            <div style="font-size: 11px; color: var(--accent); font-weight: bold;">${h.date}</div>
            <div style="font-size: 13px; margin-top: 4px;">
              ${h.items.map(i => `${i.amount}${i.unit} ${i.name}`).join(', ')}
            </div>
          </div>
        `).join('');
      }

      openModal('history-modal');
    }

    function copyMealFromHistory(histIdx, mealId) {
      const filtered = state.mealsHistory.filter(h => h.mealId === mealId);
      if (filtered[histIdx]) {
        state.meals[mealId] = JSON.parse(JSON.stringify(filtered[histIdx].items));
        renderMeals();
        closeModal('history-modal');
      }
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (key) {
        state.apiKey = key;
        localStorage.setItem('gemini_api_key', key);
        closeModal('settings-modal');
      }
    }

    async function callGemini(prompt) {
      if (!state.apiKey) {
        alert("Brak klucza API! Wprowadź go w ustawieniach (ikona koła zębatego).");
        openModal('settings-modal');
        return null;
      }

      const apiKey = state.apiKey.trim();
      const candidateModels = ['gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemini-3.1-pro'];

      for (const model of candidateModels) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (res.status === 404) continue;

          if (!res.ok) {
            const errText = await res.text();
            alert(`Błąd API (${res.status}): ${errText}`);
            return null;
          }

          const data = await res.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (rawText) return JSON.parse(rawText);
        } catch (err) {
          console.error(`Błąd z modelem ${model}:`, err);
        }
      }

      alert("Żaden z dostępnych modeli Gemini nie odpowiedział.");
      return null;
    }

    async function calculateAllWithAI() {
      document.getElementById('loading-spinner').style.display = 'block';
      
      let itemsToAnalyze = [];
      MEALS_CONFIG.forEach(meal => {
        state.meals[meal.id].forEach((item, idx) => {
          if (item.name && item.amount) {
            saveNewIngredientName(item.name);
            itemsToAnalyze.push({ mealId: meal.id, idx: idx, query: `${item.amount} ${item.unit} ${item.name}` });
          }
        });
      });

      if (itemsToAnalyze.length === 0) {
        document.getElementById('loading-spinner').style.display = 'none';
        alert("Wpisz przynajmniej jeden składnik i jego ilość!");
        return;
      }

      const prompt = `Przeanalizuj listę składników i oszacuj wartości odżywcze. Zwróć tablicę JSON:
      Lista produktów: ${JSON.stringify(itemsToAnalyze)}
      Format odpowiedzi JSON:
      [{"mealId": "...", "idx": 0, "kcal": 150, "p": 10, "f": 5, "c": 15}]`;

      const result = await callGemini(prompt);
      document.getElementById('loading-spinner').style.display = 'none';

      if (result && Array.isArray(result)) {
        result.forEach(res => {
          if (state.meals[res.mealId] && state.meals[res.mealId][res.idx]) {
            state.meals[res.mealId][res.idx].kcal = res.kcal || 0;
            state.meals[res.mealId][res.idx].p = res.p || 0;
            state.meals[res.mealId][res.idx].f = res.f || 0;
            state.meals[res.mealId][res.idx].c = res.c || 0;
          }
        });
        saveCurrentStateToHistory();
        renderMeals();
      }
    }

    async function calculateTargetsWithAI() {
      const gender = document.getElementById('prof-gender').value;
      const age = document.getElementById('prof-age').value;
      const height = document.getElementById('prof-height').value;
      const weight = document.getElementById('prof-weight').value;
      const goal = document.getElementById('prof-goal').value;

      const prompt = `Na podstawie poniższych danych wylicz dzienne zapotrzebowanie kaloryczne oraz makroskładniki (białko, tłuszcze, węglowodany):
      Płeć: ${gender}, Wiek: ${age}, Wzrost: ${height}cm, Waga: ${weight}kg, Cel/Trening: ${goal}.

      Zwróć odpowiedź w formacie JSON:
      {"kcal": 2200, "p": 160, "f": 70, "c": 230}`;

      document.getElementById('loading-spinner').style.display = 'block';
      const result = await callGemini(prompt);
      document.getElementById('loading-spinner').style.display = 'none';

      if (result && result.kcal) {
        state.targets = result;
        localStorage.setItem('macro_targets', JSON.stringify(state.targets));
        renderTargets();
        renderMeals();
        toggleProfile();
      }
    }

    init();
  </script>
